<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="noindex" />
    <title>Reconnect ? Ping Me</title>
    <link rel="icon" href="/icon.svg?v=3" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Poppins, system-ui, sans-serif;
        background: #f4f7ff;
        color: #192a45;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 36px 28px;
        text-align: center;
        background: #fff;
        border: 1px solid #dfe7f4;
        border-radius: 24px;
        box-shadow: 0 24px 80px #142d5710;
      }
      img {
        display: block;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -0.7px;
        margin: 0 0 14px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #667892;
        margin: 0 0 24px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        min-height: 44px;
        padding: 12px 22px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #8ab4ff;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #e3ebfb;
        }
        .card {
          background: #111e32;
          border-color: #2b3b53;
        }
        p {
          color: #9daec6;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg?v=3" alt="Ping Me" />
      <h1>Let's get you connected.</h1>
      <p>
        You are offline. Reconnect to the internet to open your conversations
        and send or receive messages.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
